events {
    worker_connections 128;
}

http {
    upstream embedder {
        server vllm-embedder:8000;
    }

    upstream reranker {
        server reranker:7997;
    }

    server {
        listen 80;

        # Health check endpoint
        location /health {
            default_type application/json;
            return 200 '{"status": "ok", "services": ["embedder", "reranker"]}';
        }

        # Proxy to embedder
        location /v1/ {
            proxy_pass http://embedder/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # Proxy to reranker
        location /rerank {
            proxy_pass http://reranker/rerank;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 60s;
        }
    }
}
